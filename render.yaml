services:
  - type: web
    name: badminton-coach
    env: node
    plan: free
    buildCommand: npm install && npm --prefix server install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
